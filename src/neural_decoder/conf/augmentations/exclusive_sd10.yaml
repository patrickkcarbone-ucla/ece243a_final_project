# Exclusive mode: exactly ONE aug per sample (1/3 each), at ~1.0 SD level
# No combos, no "none" - every sample gets augmented
_target_: neural_decoder.augmentations.DualRegionAugmentationPipeline
# Mixup at 1.0 SD level (ratio ~0.7 * sqrt(2) ≈ 1.0)
mixup_ratio: 0.7
# Adaptive noise at 1.0 SD level (base + scale*0.5 ≈ 1.0)
adaptive_noise_base: 0.8
adaptive_noise_scale: 0.4
# White noise at 1.0 SD
white_noise_sd: 1.0
# Standard offset
constant_offset_sd: 0.2
corr_dropout_prob: 0.0
# Exclusive stochastic mode
stochastic: exclusive

