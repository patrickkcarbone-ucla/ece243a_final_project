# @package _global_
# Ablation: TCP without curriculum (fixed α_di = 0.4)
# Tests whether decaying diphone weight helps vs fixed weight
# Based on curriculum_v2 settings
defaults:
  - override /model: transformer/tcp
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/tcp/ablations/no_curriculum

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Training schedule
nEpochs: 250
lrWarmupEpochs: 5

# Gradual LR decay (same as curriculum_v2)
lrStepStartEpoch: 70
lrStepEpochs: 10
lrStepDecay: 0.055

# LR
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP32 for stability
useMixedPrecision: false

# TCP with gating
model:
  use_gating: true
  dropout: 0.4
alpha_mono: 0.3
alpha_context: 0.3
lambda_gate: 0.01

# NO curriculum - fixed α_di = 0.4 (midpoint of 0.8→0 range) - ABLATION POINT
use_tcp_curriculum: false
alpha_di: 0.4

# Diphone vocab
diphone_vocab_path: data/diphone_vocab.pkl
