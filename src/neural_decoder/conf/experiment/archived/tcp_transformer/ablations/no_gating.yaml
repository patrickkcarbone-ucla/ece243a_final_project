# @package _global_
# Ablation: TCP without learned gating (fixed weights)
# Tests whether adaptive gating helps vs fixed 0.33/0.33/0.34 weights
# Based on curriculum_v2 settings
defaults:
  - override /model: transformer/tcp
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/tcp/ablations/no_gating

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Training schedule
nEpochs: 250
lrWarmupEpochs: 5

# Gradual LR decay (same as curriculum_v2)
lrStepStartEpoch: 70
lrStepEpochs: 10
lrStepDecay: 0.055

# LR
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP32 for stability
useMixedPrecision: false

# TCP WITHOUT learned gating (fixed weights) - ABLATION POINT
model:
  use_gating: false
  dropout: 0.4
alpha_mono: 0.3
alpha_context: 0.3
lambda_gate: 0.0 # No gate regularization needed

# TCP curriculum schedule (same as curriculum_v2)
use_tcp_curriculum: true
tcp_curriculum_start: 0.8
tcp_curriculum_end: 0.0
tcp_curriculum_step_epochs: 25
tcp_curriculum_step_size: 0.1
tcp_curriculum_start_epoch: 0

# Diphone vocab
diphone_vocab_path: data/diphone_vocab.pkl
