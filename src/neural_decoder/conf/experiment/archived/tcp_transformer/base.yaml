# @package _global_
# TCP Transformer with fixed gate weights
# Uses multi-level prediction (mono, diphone, context) with fixed weighting
defaults:
  - override /model: transformer/tcp
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/tcp/base

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Training schedule
nEpochs: 250
lrDecayEpoch: 150
lrDecayFactor: 0.1
lrWarmupEpochs: 5

# LR
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP16 for speed
useMixedPrecision: true

# TCP loss weights (fixed)
model:
  use_gating: false      # Fixed weights instead of learned gating
alpha_mono: 0.3
alpha_di: 0.4
alpha_context: 0.3
lambda_gate: 0.0         # No gate entropy regularization

# Diphone vocab
diphone_vocab_path: data/diphone_vocab.pkl


