# @package _global_
# TCP Transformer with learned gating and curriculum schedule
# α_di decays from 0.5 to 0.3 over training (full 250 epoch run)
defaults:
  - override /model: transformer/tcp
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/tcp/curriculum

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Training schedule
nEpochs: 250
lrDecayEpoch: 150
lrDecayFactor: 0.1
lrDecayEpoch2: 210
lrDecayFactor2: 0.1
lrWarmupEpochs: 5

# LR
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP32 for stability
useMixedPrecision: false

# TCP with learned gating
model:
  use_gating: true
alpha_mono: 0.3
alpha_context: 0.3
lambda_gate: 0.01

# TCP curriculum schedule for α_di (extended for 250 epochs)
# Quick run: 0.5 → 0.3 over 60 epochs (60% of 100)
# Full run: 0.5 → 0.3 over 150 epochs (60% of 250)
use_tcp_curriculum: true
tcp_curriculum_start: 0.5 # Start with higher diphone weight
tcp_curriculum_end: 0.3 # Decay to standard weight
tcp_curriculum_epochs: 150 # Decay over first 150 epochs

# Diphone vocab
diphone_vocab_path: data/diphone_vocab.pkl
