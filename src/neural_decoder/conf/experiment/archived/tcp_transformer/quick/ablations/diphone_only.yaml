# @package _global_
# Quick ablation: TCP with only diphone head (no monophone, no context)
# 100 epochs, FP16
defaults:
  - override /model: transformer/tcp
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

name: transformer/tcp/quick/ablations/diphone_only

datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Compressed schedule (100 epochs)
nEpochs: 100
lrDecayEpoch: 60
lrDecayFactor: 0.1
lrWarmupEpochs: 5

optimizer:
  lr: 0.001

batchSize: 32
maxGradNorm: 1.0
useMixedPrecision: false

# TCP - only diphone loss - ABLATION POINT
model:
  use_gating: false
  dropout: 0.4
alpha_mono: 0.0    # No monophone loss
alpha_di: 1.0      # Full weight on diphone
alpha_context: 0.0 # No context loss
lambda_gate: 0.0

# No curriculum needed (fixed diphone weight)
use_tcp_curriculum: false

diphone_vocab_path: data/diphone_vocab.pkl

