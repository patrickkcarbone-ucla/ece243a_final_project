# @package _global_
# Quick screen: TCP Transformer with learned gating + curriculum (100 epochs, FP16)
# Full TCP features scaled to 100 epochs
defaults:
  - override /model: transformer/tcp
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/tcp/quick/curriculum

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Compressed schedule (100 epochs instead of 250)
nEpochs: 100
lrDecayEpoch: 60
lrDecayFactor: 0.1
lrWarmupEpochs: 5

# LR
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP32 for stability (matching Feghhi base)
useMixedPrecision: false

# TCP with learned gating
model:
  use_gating: true
alpha_mono: 0.3
alpha_context: 0.3
lambda_gate: 0.01

# TCP curriculum schedule (scaled for 100 epochs)
# Original: 0.5 → 0.3 over 150 epochs
# Scaled: 0.5 → 0.3 over 60 epochs
use_tcp_curriculum: true
tcp_curriculum_start: 0.5
tcp_curriculum_end: 0.3
tcp_curriculum_epochs: 60

# Diphone vocab
diphone_vocab_path: data/diphone_vocab.pkl

