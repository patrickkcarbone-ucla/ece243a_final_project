# @package _global_
# Quick screen: Larger FULL TCP Transformer (100 epochs, FP32)
# All TCP features: gating + highway + curriculum
# ~50% more parameters than standard TCP
defaults:
  - override /model: transformer/tcp_larger
  - override /trainer: tcp_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/tcp/quick_larger/curriculum

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Compressed schedule (100 epochs instead of 250)
nEpochs: 100
lrDecayEpoch: 60
lrDecayFactor: 0.1
lrWarmupEpochs: 5

# LR
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP32 for stability
useMixedPrecision: false

# FULL TCP: gating + highway + curriculum
model:
  use_gating: true
  use_highway: true

# TCP loss weights
alpha_mono: 0.3
alpha_di: 0.4      # Will be overridden by curriculum
alpha_context: 0.3
lambda_gate: 0.01

# TCP curriculum schedule (α_di decays over training)
use_tcp_curriculum: true
tcp_curriculum_start: 0.5
tcp_curriculum_end: 0.3
tcp_curriculum_epochs: 60  # Scaled for 100 epoch run

# Diphone vocab
diphone_vocab_path: data/diphone_vocab.pkl

