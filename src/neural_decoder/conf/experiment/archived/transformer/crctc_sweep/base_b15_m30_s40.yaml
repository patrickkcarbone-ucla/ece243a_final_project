# @package _global_
# CR-CTC sweep: Base model + medium CR-CTC + delayed start
defaults:
  - override /model: transformer/base
  - override /trainer: transformer_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

name: transformer/crctc_sweep/base_b15_m30_s40

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Training schedule (100 epochs quick screen)
nEpochs: 100
lrDecayEpoch: 60
lrWarmupEpochs: 2

optimizer:
  lr: 0.001

batchSize: 24
maxGradNorm: 1.0
useMixedPrecision: true

# Enable diphone + intermediate (our best baseline)
model:
  use_diphone: true
  use_intermediate_ctc: true

diphone_max_alpha: 0.6
diphone_ramp_epochs: 25
intermediate_ctc_weight: 0.3

# CR-CTC: Medium settings
useCRCTC: true
crctcBeta: 0.15              # Moderate β
crctcStartEpoch: 40          # Start delayed
crctcRampEpochs: 30          # Ramp (reaches 0.15 at epoch 70)
crctcHeavyMasks: 30          # More masking
crctcHeavyFraction: 0.20     # Higher mask fraction
crctcGradientAccum: true

