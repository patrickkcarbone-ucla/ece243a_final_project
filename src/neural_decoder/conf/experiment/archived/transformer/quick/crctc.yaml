# @package _global_
# Quick screen: Transformer + CR-CTC (100 epochs, FP16)
defaults:
  - override /model: transformer/base
  - override /trainer: transformer_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/quick/crctc

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Compressed schedule
nEpochs: 100
lrDecayEpoch: 60
lrWarmupEpochs: 2

# Standard LR (0.002 caused divergence)
optimizer:
  lr: 0.001

# Smaller batch for CR-CTC (2x forward passes)
batchSize: 24

# Gradient clipping
maxGradNorm: 1.0

# FP16 for speed
useMixedPrecision: true

# Enable CR-CTC
useCRCTC: true
crctcBeta: 0.2
crctcGradientAccum: true

