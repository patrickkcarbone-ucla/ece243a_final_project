# @package _global_
# Quick screen: Transformer + Diphone (100 epochs, FP16)
defaults:
  - override /model: transformer/base
  - override /trainer: transformer_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/quick/diphone

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Compressed schedule
nEpochs: 100
lrDecayEpoch: 60
lrWarmupEpochs: 2

# Standard LR (0.002 caused divergence)
optimizer:
  lr: 0.001

# Batch size
batchSize: 32

# Gradient clipping
maxGradNorm: 1.0

# FP16 for speed
useMixedPrecision: true

# Enable diphone loss
model:
  use_diphone: true
  n_diphones: 1600

# Diphone settings (scaled for 100 epochs)
diphone_vocab_path: data/diphone_vocab.pkl
diphone_max_alpha: 0.6
diphone_ramp_epochs: 10  # 25 * 0.4

