# @package _global_
# Quick screen: Transformer + Diphone + Intermediate CTC + CR-CTC (ramped slow)
# 100 epochs, FP16
defaults:
  - override /model: transformer/base
  - override /trainer: transformer_ctc
  - override /augmentations: transformer_baseline
  - override /optimizer: adamw

# Experiment name
name: transformer/quick/diphone_intermediate_crctc_ramped_slow

# Dataset
datasetPath: dual_region_data/ptDecoder_ctc_dual_region_logSBP
useDualRegion: true

# Compressed schedule
nEpochs: 100
lrDecayEpoch: 60
lrWarmupEpochs: 2

# Standard LR
optimizer:
  lr: 0.001

# Smaller batch for CR-CTC (2x forward passes)
batchSize: 24

# Gradient clipping
maxGradNorm: 1.0

# FP16 for speed
useMixedPrecision: true

# Enable diphone + intermediate CTC
model:
  use_diphone: true
  n_diphones: 1600
  use_intermediate_ctc: true
  intermediate_layer: 2

# Diphone settings (scaled for 100 epochs)
diphone_vocab_path: data/diphone_vocab.pkl
diphone_max_alpha: 0.6
diphone_ramp_epochs: 10  # 25 * 0.4

# Intermediate CTC weight
intermediate_ctc_weight: 0.3

# CR-CTC with slow ramped β
useCRCTC: true
crctcBeta: 0.2           # Max β
crctcStartEpoch: 30      # Delay consistency until epoch 30
crctcRampEpochs: 50      # Linearly ramp β from 0 → 0.2 over epochs 30–80
crctcGradientAccum: true


