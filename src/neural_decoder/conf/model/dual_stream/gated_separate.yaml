# Dual-stream GRU with gated fusion and separate day layers
# NOTE: Best performing dual-stream variant, but still underperforms baseline
_target_: neural_decoder.models.dual_gru.DualStreamGRUDecoder
name: dual_stream/gated_separate
neural_dim: 512
n_classes: 40
hidden_dim: 1024
layer_dim: 5
dropout: 0.4
strideLen: 4
kernelLen: 32
gaussianSmoothWidth: 2.0
fusion_strategy: gated
day_layer_mode: separate

