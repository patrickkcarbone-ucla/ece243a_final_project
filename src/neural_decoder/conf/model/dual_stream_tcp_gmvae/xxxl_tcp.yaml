# Dual-Stream TCP + GMVAE XXXL Model Configuration
# TCP params from transformer/tcp/quick_xxxl/gated best run
_target_: neural_decoder.models.dual_stream_tcp_gmvae.DualStreamTCPGMVAE
name: dual_stream_tcp_gmvae/xxxl_tcp

# ==============================================================================
# Common Parameters
# ==============================================================================
neural_dim: 256
n_classes: 40
nDays: 24
device: cuda

# ==============================================================================
# Transformer Architecture (from tcp_xxxl best)
# ==============================================================================
hidden_dim: 896
num_layers: 10
num_heads: 8
ffn_dim: 3584
patch_len: 5
patch_stride: 5
dropout: 0.35
attn_dropout: 0.1
input_dropout: 0.2
max_rel_pos: 64

# Time masking
num_masks: 20
max_mask_fraction: 0.075

# ==============================================================================
# TCP Parameters (from tcp_xxxl best)
# ==============================================================================
use_tcp: true
mono_layer: 3
diphone_layer: 6
use_gating: true
use_highway: true
fixed_gate_weights: [0.33, 0.33, 0.34]
n_diphones: 1600

# ==============================================================================
# GMVAE Parameters (increased capacity for better phoneme learning)
# ==============================================================================
gmvae_hidden_dim: 768   # Increased from 512
gmvae_z_dim: 128        # Increased from 64
n_clusters: 40
gmvae_init_temp: 1.0
gmvae_min_temp: 0.5
gmvae_decay_temp_rate: 0.013
gmvae_tap_layer: 3      # Tap TCP at mono_layer for phonetically-structured input
detach_gmvae_input: false  # Allow gradients to flow from GMVAE back through TCP

# ==============================================================================
# Fusion Parameters
# ==============================================================================
fusion_method: gated
fusion_dropout: 0.1
