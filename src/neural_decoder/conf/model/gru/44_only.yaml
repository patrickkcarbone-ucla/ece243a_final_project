# GRU using only Area 44 channels (last 128 of 256)
# For single-region dataset
# NOTE: Experiments show Area 44 has NO useful signal for speech decoding
_target_: neural_decoder.models.gru.GRUDecoder
name: gru/44_only
neural_dim: 256
n_classes: 40
hidden_dim: 1024
layer_dim: 5
dropout: 0.4
strideLen: 4
kernelLen: 32
gaussianSmoothWidth: 2.0
use_channels: 44_only

