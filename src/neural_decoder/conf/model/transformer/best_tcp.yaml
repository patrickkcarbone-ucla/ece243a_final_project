# TCP Transformer XXXL - Triple Extra Large capacity
# ~25% more than XXL, ~200% more than base
# hidden_dim: 384 → 480 → 576 → 720 → 896
_target_: neural_decoder.models.tcp_transformer.TCPTransformer
name: transformer/best_tcp
neural_dim: 256
n_classes: 40

hidden_dim: 896
num_layers: 10
num_heads: 8
ffn_dim: 3584

patch_len: 5
patch_stride: 5

dropout: 0.35
attn_dropout: 0.1
input_dropout: 0.2

max_rel_pos: 64

num_masks: 20
max_mask_fraction: 0.075

use_tcp: true
mono_layer: 3
diphone_layer: 6
use_gating: true
use_highway: true
n_diphones: 1600

